<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Постер с QR-кодом</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    @page { size: A4; margin: 0; }
    body { background: #e9e6de; }
    .bar { max-width: 210mm; margin: 16px auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 12px; }
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto 24px; background: #fff; padding: 22mm 18mm; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: var(--shadow); }
    .center { font-size: 22pt; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
    h1 { font-size: 40pt; line-height: 1.05; letter-spacing: -0.03em; margin: 12mm 0 6mm; }
    .lead { font-size: 17pt; color: var(--ink-2); max-width: 150mm; margin: 0; }
    .qr { width: 110mm; height: 110mm; margin: 14mm 0 8mm; padding: 6mm; border: 2mm solid var(--accent); border-radius: 8mm; }
    .qr svg { width: 100%; height: 100%; display: block; }
    .steps { display: flex; gap: 5mm; font-size: 12pt; font-weight: 700; color: var(--ink); margin-top: 4mm; }
    .steps span { background: var(--accent-soft); border-radius: 999px; padding: 3mm 5mm; white-space: nowrap; }
    .url { margin-top: auto; font-size: 11pt; color: var(--ink-3); word-break: break-all; }
    @media print { body { background: #fff; } .bar { display: none; } .sheet { box-shadow: none; margin: 0; } }
    @media screen and (max-width: 820px) { .sheet { width: 100%; min-height: auto; padding: 32px 20px; } h1 { font-size: 30px; } .lead { font-size: 16px; } .qr { width: 260px; height: 260px; } .steps { flex-direction: column; gap: 8px; font-size: 14px; } .center { font-size: 18px; } }
  </style>
</head>
<body>
  <div class="bar"><span class="muted">Распечатайте на A4 и поставьте на ресепшен или у входа.</span><button class="btn small" type="button" onclick="print()">Печать</button></div>
  <article class="sheet">
    <div class="center" id="name">…</div>
    <h1>Вопросы о курсах и запись на пробный урок</h1>
    <p class="lead">Наведите камеру телефона на QR-код — администратор ответит сразу, в любое время.</p>
    <div class="qr" id="qr"></div>
    <div class="steps"><span>1. Наведите камеру</span><span>2. Задайте вопрос</span><span>3. Выберите время</span></div>
    <div class="url" id="url"></div>
  </article>
  <script src="/assets/qrcode.js"></script>
  <script>
    (async () => {
      const slug = (new URLSearchParams(location.search).get("c") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
      const link = `${location.origin}/chat/?c=${slug}&src=qr`;
      document.getElementById("url").textContent = `${location.origin}/chat/?c=${slug}`;
      const qr = qrcode(0, "M");
      qr.addData(link);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      try {
        const r = await fetch(`/api/public/${slug}`);
        const d = await r.json();
        document.getElementById("name").textContent = d.name || "";
        document.title = `QR-постер — ${d.name}`;
      } catch { document.getElementById("name").textContent = ""; }
    })();
  </script>
</body>
</html>
